# Vérification automatique de l'app à chaque push et pull request : typage, lint (erreurs seulement), tests.
# La compilation des binaires (EAS) reste lancée à la main.
name: Vérification
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typage
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint src __tests__
      - name: Tests
        run: npx jest --ci
